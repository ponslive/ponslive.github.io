    const s = stageIndex(), k = s.k, t = clamp(s.t, 0, 1);
    if (k < 0) { target.m = 0; target.year = P.eras[0].to; }
    else {
      target.m = k === 0 ? 0 : (k - 1) + ease(clamp(t / .38, 0, 1));
      const from = k === 0 ? P.eras[0].to : P.eras[k - 1].from, to = P.eras[k].from;
      target.year = from + (to - from) * clamp(t / .8, 0, 1);
    }
    const inStage = k >= 0 && s.t <= 1.02, introVisible = scrollY < innerHeight * .9;
    const afterTop = absTop(after), endT = clamp((scrollY + innerHeight - afterTop) / (innerHeight * .8), 0, 1);
    target.fade = 1 - endT;
    const era = inStage ? k : -1;
    if (era !== curEra) { curEra = era; setRail(era); }
    rail.style.opacity = inStage ? '1' : '0'; rail.style.pointerEvents = inStage ? '' : 'none';
    yearEl.style.opacity = inStage || introVisible ? '1' : '0';
    live = introVisible || inStage || endT < 1 && scrollY + innerHeight > absTop(stages[0]);
    dmat.uniforms.uScroll.value = scrollY;
  }
  addEventListener('scroll', readScroll, { passive: true }); addEventListener('resize', readScroll); readScroll();

  let px = 0, py = 0, tx = 0, ty = 0;
  addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; }, { passive: true });

  gsap.registerPlugin(ScrollTrigger);
  gsap.set(['.intro-copy', '.era-copy'], { opacity: 1 });
  gsap.timeline({ delay: .2 })
    .from('#intro-name', { yPercent: 30, opacity: 0, filter: 'blur(16px)', duration: 1.6, ease: 'expo.out' })
    .from('.intro .lede', { y: 24, opacity: 0, duration: 1.1, ease: 'expo.out' }, '-=1.1')
    .from('.intro-index li', { y: 14, opacity: 0, duration: .8, stagger: .06, ease: 'expo.out' }, '-=.8')
    .from('.cue', { opacity: 0, x: -16, duration: .9, ease: 'expo.out' }, '-=.6');
  gsap.to('.intro-copy', { opacity: 0, y: -60, filter: 'blur(8px)', ease: 'none', scrollTrigger: { trigger: '#timeline', start: 'top top', end: 'bottom 30%', scrub: true } });
  stages.forEach(st => {
    const q = sel => st.querySelectorAll(sel);
    const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
    tl.fromTo(q('.ln'), { yPercent: 115, rotate: 2 }, { yPercent: 0, rotate: 0, duration: 1.3 })
      .fromTo(q('.era-meta'), { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 1 }, '-=1.0')
      .fromTo(q('.era-line'), { opacity: 0, filter: 'blur(14px)', y: 18 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 1.2 }, '-=.85')
      .fromTo(q('.era-body'), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1 }, '-=.9')
      .fromTo(q('.proof li'), { clipPath: 'inset(0 0 100% 0)', y: 14 }, { clipPath: 'inset(0 0 0% 0)', y: 0, duration: 1, stagger: .1 }, '-=.8')
      .fromTo(q('.chip'), { opacity: 0, scale: .86 }, { opacity: 1, scale: 1, duration: .7, stagger: .035, ease: 'back.out(2)' }, '-=.8');
    ScrollTrigger.create({ trigger: st, start: 'top 45%', end: 'bottom top', onEnter: () => tl.play(), onEnterBack: () => tl.play(), onLeaveBack: () => tl.reverse() });
    gsap.fromTo(st.querySelector('.era-copy'), { opacity: 1, y: 0, filter: 'blur(0px)' }, { opacity: 0, y: -70, filter: 'blur(10px)', ease: 'none', immediateRender: false, scrollTrigger: { trigger: st, start: 'bottom 75%', end: 'bottom 25%', scrub: true } });
  });

  const clock = new THREE.Clock();
  let running = true, raf = 0, plateI = -1;
  function frame() {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, k = 1 - Math.pow(.0016, dt);
    cur.m += (target.m - cur.m) * k * .9; cur.year += (target.year - cur.year) * k; cur.fade += (target.fade - cur.fade) * k;
    const yr = Math.round(cur.year); if (yearEl.textContent !== String(yr)) yearEl.textContent = yr;
    if (!live && Math.abs(target.m - cur.m) < .001) return;
    uniforms.uMorph.value = cur.m; uniforms.uTime.value = t; uniforms.uFade.value = cur.fade;
    const i = Math.min(Math.floor(cur.m), 3), f = cur.m - i;
    if (pu.tA.value !== plates[i] || pu.tB.value !== plates[i + 1]) {
      pu.tA.value = plates[i]; pu.tB.value = plates[i + 1];
      pu.aA.value = plates[i].userData.aspect || 1.6; pu.aB.value = plates[i + 1].userData.aspect || 1.6;
      pu.gA.value = plates[i].userData.gain || 1; pu.gB.value = plates[i + 1].userData.gain || 1;
      const ka = plates[i].userData.tint || [1, .56, .24], kb = plates[i + 1].userData.tint || [1, .56, .24];
      pu.kA.value.set(ka[0], ka[1], ka[2], plates[i].userData.sky || 0); pu.kB.value.set(kb[0], kb[1], kb[2], plates[i + 1].userData.sky || 0);
    }
    pu.uMix.value = f;
    if (plateI !== i) { plateI = i; Object.entries(videos).forEach(([vi, v]) => { if (+vi === i || +vi === i + 1) v.play().catch(() => {}); else v.pause(); }); }
    px += (tx - px) * k * .5; py += (ty - py) * k * .5;
    let wp = 0; for (let j = 0; j < 5; j++) if (!isPhoto[j]) wp += Math.max(0, 1 - Math.abs(cur.m - j)); wp = Math.min(1, wp);
    const bq = group.userData.base, bp = group.userData.photo, L = (a, b2) => a + (b2 - a) * wp;
    const gx = L(bp.x, bq.x), gy = L(bp.y, bq.y);
    group.position.set(gx, gy, 0); group.scale.setScalar(L(bp.s, bq.s));
    group.rotation.y = (innerWidth < 768 ? 0 : -.3) * wp + px * (.05 + .27 * wp) + Math.sin(t * .15) * (.012 + .05 * wp);
    group.rotation.x = py * (.04 + .12 * wp) + Math.sin(t * .2) * .02 * wp;
    camera.position.set(px * .3, -py * .2, 9); camera.lookAt(gx * .35 * wp, gy * .5 * wp, 0);
    composer.render();
  }
  frame(); root.classList.add('fx-ready');
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) { cancelAnimationFrame(raf); running = false; Object.values(videos).forEach(v => v.pause()); }
    else if (!document.hidden && !running) { running = true; clock.getDelta(); plateI = -1; frame(); }
  });
  addEventListener('pagehide', () => { cancelAnimationFrame(raf); geo.dispose(); mat.dispose(); dgeo.dispose(); dmat.dispose(); plates.forEach(p => p && p.dispose()); renderer.dispose(); });
  window.__rewind = { cur, target };
}

if (reduced || !hasGL() || !window.gsap || !window.ScrollTrigger) goStatic();
else { try { start(); } catch (e) { console.error(e); goStatic(); } }
</script>
